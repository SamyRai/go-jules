name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Verify Go proxy indexing
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          GOPROXY=proxy.golang.org go list -m github.com/SamyRai/go-jules@"${VERSION}"
