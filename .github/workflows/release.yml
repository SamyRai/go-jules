name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify, for example v0.1.0"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26.3"
  MODULE_PATH: "github.com/SamyRai/go-jules"

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate release version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be a Go module semver tag such as v0.2.0 or v0.2.0-rc.1"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} does not exist in this repository"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Check go.mod/go.sum consistency
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Validate Jules API coverage
        run: go run ./internal/cmd/jules-api-coverage

      - name: Verify module path
        shell: bash
        run: |
          MODULE="$(go list -m)"
          if [ "${MODULE}" != "${MODULE_PATH}" ]; then
            echo "::error::Module path ${MODULE} does not match ${MODULE_PATH}"
            exit 1
          fi

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "GitHub release ${VERSION} already exists; leaving it unchanged."
          else
            gh release create "${VERSION}" \
              --verify-tag \
              --title "${VERSION}" \
              --generate-notes
          fi

      - name: Verify Go proxy indexing
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if GOPROXY=proxy.golang.org go list -m "${MODULE_PATH}@${VERSION}"; then
              exit 0
            fi
            sleep_seconds=$((attempt * 10))
            echo "Go proxy has not indexed ${MODULE_PATH}@${VERSION} yet; retrying in ${sleep_seconds}s"
            sleep "${sleep_seconds}"
          done

          echo "::error::Go proxy did not index ${MODULE_PATH}@${VERSION}"
          exit 1
